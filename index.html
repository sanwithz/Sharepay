<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SharePay - Receipt Splitter</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- SweetAlert2 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- React & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Pre-load Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    /* Custom animations to replace tailwindcss-animate plugin */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .animate-fade-in-up {
      animation: slideUp 0.5s ease-out forwards;
    }
    .animate-fade-in-right {
      animation: slideInRight 0.3s ease-out forwards;
    }
    /* Hide scrollbar for cleaner mobile look */
    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Helper for formatting currency with thousand separators
    const formatCurrency = (value) => {
      const num = parseFloat(value);
      if (isNaN(num)) return '0.00';
      return num.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    // SweetAlert2 Toast configuration
    const Toast = Swal.mixin({
      toast: true,
      position: 'top',
      showConfirmButton: false,
      timer: 3000,
      timerProgressBar: true,
      didOpen: (toast) => {
        toast.addEventListener('mouseenter', Swal.stopTimer)
        toast.addEventListener('mouseleave', Swal.resumeTimer)
      }
    });

    // --- Inline Icons (replacing lucide-react for standalone HTML) ---
    const IconBase = ({ children, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );

    const Share2 = ({ className }) => <IconBase className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></IconBase>;

    const Camera = ({ className }) => <IconBase className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconBase>;
    const Plus = ({ className }) => <IconBase className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>;
    const Trash2 = ({ className }) => <IconBase className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
    const ChevronRight = ({ className }) => <IconBase className={className}><polyline points="9 18 15 12 9 6"/></IconBase>;
    const ChevronLeft = ({ className }) => <IconBase className={className}><polyline points="15 18 9 12 15 6"/></IconBase>;
    const PieChart = ({ className }) => <IconBase className={className}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconBase>;
    const Receipt = ({ className }) => <IconBase className={className}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/></IconBase>;
    const Edit2 = ({ className }) => <IconBase className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>;
    const AlertCircle = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconBase>;
    const X = ({ className }) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
    // ------------------------------------------------------------------

    // Reusable Card Component
    const Card = ({ children, className = '' }) => (
      <div className={`bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden ${className}`}>
        {children}
      </div>
    );

    // Reusable Button Component
    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, icon: Icon }) => {
      const baseStyle = "flex items-center justify-center font-semibold rounded-2xl transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:active:scale-100 disabled:cursor-not-allowed px-5 py-3.5";
      const variants = {
        primary: "bg-indigo-600 text-white hover:bg-indigo-700 shadow-md shadow-indigo-200",
        secondary: "bg-indigo-50 text-indigo-700 hover:bg-indigo-100",
        danger: "bg-red-50 text-red-600 hover:bg-red-100",
        outline: "border-2 border-gray-200 text-gray-700 hover:border-gray-300 bg-transparent",
        ghost: "bg-transparent text-gray-500 hover:bg-gray-100"
      };
      
      return (
        <button 
          onClick={onClick} 
          disabled={disabled} 
          className={`${baseStyle} ${variants[variant]} ${className}`}
        >
          {Icon && <Icon className="w-5 h-5 mr-2" />}
          {children}
        </button>
      );
    };

    function SharePayApp() {
      const [step, setStep] = useState(1);
      
      // OCR State
      const [image, setImage] = useState(null);
      const [ocrStatus, setOcrStatus] = useState('idle'); // idle, processing, error
      const [ocrProgress, setOcrProgress] = useState(0);
      const [ocrStatusText, setOcrStatusText] = useState('Initializing...');
      const fileInputRef = useRef(null);

      // Bill State
      const [items, setItems] = useState([]);
      const [tax, setTax] = useState(0);
      const [serviceCharge, setServiceCharge] = useState(0);
      const [people, setPeople] = useState([
        { id: '1', name: 'Me' },
        { id: '2', name: 'Friend 1' }
      ]);

      // UI State
      const [errorMsg, setErrorMsg] = useState('');

      // LIFF & URL State
      const [liffProfile, setLiffProfile] = useState(null);
      const [isLiffInit, setIsLiffInit] = useState(false);

      // State Compression/Decompression for smaller URLs
      const compressState = () => {
        return {
          i: items.map(item => [
            item.name,
            parseFloat(item.price) || 0,
            item.assignedTo.map(id => people.findIndex(p => p.id === id)).filter(idx => idx !== -1)
          ]),
          p: people.map(p => p.name),
          t: parseFloat(tax) || 0,
          s: parseFloat(serviceCharge) || 0
        };
      };

      const decompressState = (compressed) => {
        const restoredPeople = (compressed.p || []).map((name, idx) => ({
          id: idx.toString(),
          name
        }));
        
        const restoredItems = (compressed.i || []).map((itemArray, idx) => ({
          id: idx.toString(),
          name: itemArray[0],
          price: itemArray[1],
          assignedTo: (itemArray[2] || []).map(pIdx => pIdx.toString())
        }));

        return {
          items: restoredItems,
          people: restoredPeople,
          tax: compressed.t || 0,
          serviceCharge: compressed.s || 0,
          step: 4
        };
      };

      // Load state from URL query param 'bill' if present
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const billData = urlParams.get('bill');
        if (billData) {
          try {
            const rawDecoded = decodeURIComponent(escape(atob(billData)));
            const parsed = JSON.parse(rawDecoded);
            
            if (parsed.i && parsed.p) {
              const decompressed = decompressState(parsed);
              setItems(decompressed.items);
              setPeople(decompressed.people);
              setTax(decompressed.tax);
              setServiceCharge(decompressed.serviceCharge);
              setStep(decompressed.step);
            } else {
              if (parsed.items) setItems(parsed.items);
              if (parsed.people) setPeople(parsed.people);
              if (parsed.tax !== undefined) setTax(parsed.tax);
              if (parsed.serviceCharge !== undefined) setServiceCharge(parsed.serviceCharge);
              if (parsed.step) setStep(parsed.step);
            }
          } catch (e) {
            console.error("Failed to parse bill from URL", e);
          }
        }
      }, []);

      // LIFF SDK Init
      useEffect(() => {
        if (window.liff) {
          window.liff.init({ liffId: "2007125937-7USdi4nM" })
            .then(() => {
              setIsLiffInit(true);
              console.log("LIFF initialized successfully");
              if (!window.liff.isLoggedIn()) {
                window.liff.login();
              } else {
                window.liff.getProfile()
                  .then(profile => {
                    setLiffProfile(profile);
                    // Update the first person ("Me") to the user's LINE display name
                    setPeople(prev => prev.map(p => p.id === '1' ? { ...p, name: profile.displayName } : p));
                  })
                  .catch(err => console.error("Error getting profile:", err));
              }
            })
            .catch(err => {
              console.error("LIFF initialization failed", err);
            });
        }
      }, []);

      const getShareUrl = () => {
        const state = compressState();
        const jsonStr = JSON.stringify(state);
        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        return `https://liff.line.me/2007125937-7USdi4nM?bill=${encodeURIComponent(encoded)}`;
      };

      const getBillSummaryText = () => {
        let msg = `💸 SharePay - สรุปยอดหารค่า\n`;
        msg += `ยอดรวมทั้งหมด: ฿${formatCurrency(calculations.grandTotal)}\n`;
        msg += `จำนวนหาร : ${people.length} คน\n`;
        
        const avg = calculations.grandTotal / (people.length || 1);
        msg += `ยอดรวมจ่าย : ฿${formatCurrency(avg)}\n\n`;
        msg += `รายละเอียดรายบุคคล:\n`;
        
        people.forEach(person => {
          const data = calculations.personTotals[person.id];
          if (data && data.total > 0) {
            msg += `- ${person.name}: ฿${formatCurrency(data.total)}\n`;
          }
        });
        
        msg += `\nดูรายละเอียด/แก้ไขบิลได้ที่: ${getShareUrl()}`;
        return msg;
      };

      const getFlexMessage = () => {
        const totalBillStr = `฿${formatCurrency(calculations.grandTotal)}`;
        const peopleCountStr = `${people.length} คน`;
        const avgAmountStr = `฿${formatCurrency(calculations.grandTotal / (people.length || 1))}`;
        
        const peopleContents = people.map((person, idx) => {
          const data = calculations.personTotals[person.id];
          const amount = data ? data.total : 0;
          return {
            "type": "box",
            "layout": "horizontal",
            "margin": "sm",
            "contents": [
              {
                "type": "text",
                "text": `• ${person.name}`,
                "size": "sm",
                "color": "#4b5563"
              },
              {
                "type": "text",
                "text": `฿${formatCurrency(amount)}`,
                "size": "sm",
                "align": "end",
                "weight": "bold",
                "color": "#1f2937"
              }
            ]
          };
        });

        return {
          "type": "flex",
          "altText": `💸 SharePay - สรุปยอดหารค่าอาหาร ${totalBillStr}`,
          "contents": {
            "type": "bubble",
            "body": {
              "type": "box",
              "layout": "vertical",
              "spacing": "md",
              "contents": [
                {
                  "type": "text",
                  "text": "💸 SharePay - สรุปยอดหารค่า",
                  "weight": "bold",
                  "size": "md",
                  "color": "#4f46e5"
                },
                {
                  "type": "separator"
                },
                {
                  "type": "box",
                  "layout": "vertical",
                  "spacing": "sm",
                  "contents": [
                    {
                      "type": "box",
                      "layout": "horizontal",
                      "contents": [
                        {
                          "type": "text",
                          "text": "ยอดรวมทั้งหมด:",
                          "size": "sm",
                          "color": "#4b5563"
                        },
                        {
                          "type": "text",
                          "text": totalBillStr,
                          "size": "sm",
                          "align": "end",
                          "weight": "bold",
                          "color": "#1f2937"
                        }
                      ]
                    },
                    {
                      "type": "box",
                      "layout": "horizontal",
                      "contents": [
                        {
                          "type": "text",
                          "text": "จำนวนหาร:",
                          "size": "sm",
                          "color": "#4b5563"
                        },
                        {
                          "type": "text",
                          "text": peopleCountStr,
                          "size": "sm",
                          "align": "end",
                          "weight": "bold",
                          "color": "#1f2937"
                        }
                      ]
                    },
                    {
                      "type": "box",
                      "layout": "horizontal",
                      "contents": [
                        {
                          "type": "text",
                          "text": "ยอดรวมจ่าย:",
                          "size": "sm",
                          "color": "#4b5563"
                        },
                        {
                          "type": "text",
                          "text": avgAmountStr,
                          "size": "sm",
                          "align": "end",
                          "weight": "bold",
                          "color": "#1f2937"
                        }
                      ]
                    }
                  ]
                },
                {
                  "type": "separator"
                },
                {
                  "type": "box",
                  "layout": "vertical",
                  "spacing": "xs",
                  "contents": [
                    {
                      "type": "text",
                      "text": "ยอดจ่ายรายบุคคล:",
                      "size": "sm",
                      "weight": "bold",
                      "color": "#111111",
                      "margin": "xs"
                    },
                    ...peopleContents
                  ]
                }
              ]
            },
            "footer": {
              "type": "box",
              "layout": "vertical",
              "contents": [
                {
                  "type": "button",
                  "action": {
                    "type": "uri",
                    "label": "ดูรายละเอียด/แก้ไขบิล",
                    "uri": getShareUrl()
                  },
                  "style": "primary",
                  "color": "#4f46e5"
                }
              ]
            }
          }
        };
      };

      const handleShareToLine = async () => {
        if (!window.liff) {
          const summaryText = getBillSummaryText();
          navigator.clipboard.writeText(summaryText);
          Toast.fire({
            icon: 'success',
            title: 'คัดลอกสรุปยอดไปยังคลิปบอร์ดแล้ว!'
          });
          return;
        }
        
        if (!window.liff.isLoggedIn()) {
          window.liff.login();
          return;
        }

        const summaryText = getBillSummaryText();
        
        if (window.liff.isApiAvailable('shareTargetPicker')) {
          try {
            const res = await window.liff.shareTargetPicker([
              getFlexMessage()
            ]);
            if (res) {
              Toast.fire({
                icon: 'success',
                title: 'แชร์สำเร็จแล้ว!'
              });
            }
          } catch (err) {
            console.error("Error sharing via Target Picker", err);
            navigator.clipboard.writeText(summaryText);
            Swal.fire({
              icon: 'error',
              title: 'แชร์ผ่าน LINE ล้มเหลว',
              text: `ข้อผิดพลาด: ${err.message || JSON.stringify(err)}\n\n(ระบบได้คัดลอกสรุปยอดแบบข้อความธรรมดาไปยังคลิปบอร์ดของคุณเรียบร้อยแล้ว)`,
              confirmButtonText: 'ตกลง'
            });
          }
        } else {
          navigator.clipboard.writeText(summaryText);
          Toast.fire({
            icon: 'success',
            title: 'คัดลอกสรุปยอดไปยังคลิปบอร์ดแล้ว!'
          });
        }
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const imageUrl = URL.createObjectURL(file);
        setImage(imageUrl);
        processOCR(imageUrl);
      };

      const processOCR = async (imageUrl) => {
        setOcrStatus('processing');
        setOcrProgress(0);
        setOcrStatusText('Initializing OCR...');
        setErrorMsg('');

        if (!window.Tesseract) {
          setOcrStatus('error');
          setErrorMsg('OCR library is still loading. Please try again in a few seconds, or check your internet connection.');
          return;
        }

        try {
          // Using eng+tha for Thai receipts. 
          // Updated to Tesseract v5 API structure to fix DataCloneError
          const worker = await window.Tesseract.createWorker('eng+tha', 1, {
            logger: m => {
              // Capitalize the first letter of the status for better UI
              const statusStr = m.status ? m.status.charAt(0).toUpperCase() + m.status.slice(1) : 'Processing...';
              setOcrStatusText(statusStr);
              
              if (m.progress !== undefined) {
                setOcrProgress(Math.round(m.progress * 100));
              }
            }
          });
          
          const { data: { text } } = await worker.recognize(imageUrl);
          await worker.terminate();
          
          parseReceiptText(text);
          setOcrStatus('idle');
          setStep(2);
        } catch (error) {
          console.error(error);
          setOcrStatus('error');
          setErrorMsg('Failed to read the receipt. The image might be unclear, or the OCR engine had an issue. Please enter items manually.');
          // Allow them to proceed manually anyway
          setItems([{ id: Date.now().toString(), name: 'Item 1', price: 0, assignedTo: [] }]);
          setStep(2);
        }
      };

      const parseReceiptText = (rawText) => {
        const cleanedText = rawText.replace(/([\u0E00-\u0E7F])\s+(?=[\u0E00-\u0E7F])/g, '$1');
        const lines = cleanedText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const parsedItems = [];
        
        // Basic heuristic: Look for a line that ends with a number (potentially with decimals)
        // and has some text before it.
        const priceRegex = /(.+?)\s+((?:\d{1,3}(?:,\d{3})*|\d+)(?:\.\d{2})?)\s*$/;
        
        lines.forEach(line => {
          const match = line.match(priceRegex);
          if (match) {
            let name = match[1].trim();
            let priceStr = match[2].replace(/,/g, '');
            let price = parseFloat(priceStr);

            // Filter out obvious non-items or summaries (Subtotal, Total, VAT)
            const lowerName = name.toLowerCase();
            if (
              lowerName.includes('total') || lowerName.includes('ยอดรวม') ||
              lowerName.includes('vat') || lowerName.includes('ภาษี') ||
              lowerName.includes('change') || lowerName.includes('เงินทอน') ||
              lowerName.includes('cash') || lowerName.includes('เงินสด')
            ) {
              // Attempt to extract tax/service charge if matched
              if (lowerName.includes('vat') || lowerName.includes('ภาษี')) setTax(price);
              if (lowerName.includes('service') || lowerName.includes('บริการ')) setServiceCharge(price);
              return;
            }

            if (!isNaN(price) && price > 0 && name.length > 1) {
              parsedItems.push({
                id: Math.random().toString(36).substr(2, 9),
                name: name,
                price: price,
                assignedTo: []
              });
            }
          }
        });

        if (parsedItems.length === 0) {
          parsedItems.push({ id: Date.now().toString(), name: '', price: 0, assignedTo: [] });
        }

        setItems(parsedItems);
      };

      const addItem = () => {
        setItems([...items, { id: Date.now().toString(), name: '', price: 0, assignedTo: [] }]);
      };

      const updateItem = (id, field, value) => {
        setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const removeItem = (id) => {
        setItems(items.filter(item => item.id !== id));
      };

      const addPerson = () => {
        const newName = `Friend ${people.length}`;
        setPeople([...people, { id: Date.now().toString(), name: newName }]);
      };

      const updatePerson = (id, newName) => {
        setPeople(people.map(p => p.id === id ? { ...p, name: newName } : p));
      };

      const removePerson = (id) => {
        setPeople(people.filter(p => p.id !== id));
        // Also remove them from any items
        setItems(items.map(item => ({
          ...item,
          assignedTo: item.assignedTo.filter(personId => personId !== id)
        })));
      };

      const togglePersonForItem = (itemId, personId) => {
        setItems(items.map(item => {
          if (item.id === itemId) {
            const isAssigned = item.assignedTo.includes(personId);
            return {
              ...item,
              assignedTo: isAssigned 
                ? item.assignedTo.filter(id => id !== personId)
                : [...item.assignedTo, personId]
            };
          }
          return item;
        }));
      };

      const calculations = useMemo(() => {
        let subtotal = 0;
        const personTotals = {};
        people.forEach(p => personTotals[p.id] = { itemsOwed: 0, taxOwed: 0, serviceOwed: 0, total: 0 });

        // Calculate base item splits
        items.forEach(item => {
          const price = parseFloat(item.price) || 0;
          subtotal += price;
          
          // If no one is assigned, split among everyone by default
          const activeAssignees = item.assignedTo && item.assignedTo.length > 0 ? item.assignedTo : people.map(p => p.id);
          const assigneesCount = activeAssignees.length;
          
          if (assigneesCount > 0) {
            const splitPrice = price / assigneesCount;
            activeAssignees.forEach(personId => {
              if (personTotals[personId]) {
                personTotals[personId].itemsOwed += splitPrice;
              }
            });
          }
        });

        const parsedTax = parseFloat(tax) || 0;
        const parsedSc = parseFloat(serviceCharge) || 0;
        const totalExtras = parsedTax + parsedSc;
        const grandTotal = subtotal + totalExtras;

        // Distribute tax and service charge proportionally based on item spend
        if (subtotal > 0) {
          people.forEach(p => {
            const personData = personTotals[p.id];
            const proportion = personData.itemsOwed / subtotal;
            
            personData.taxOwed = parsedTax * proportion;
            personData.serviceOwed = parsedSc * proportion;
            personData.total = personData.itemsOwed + personData.taxOwed + personData.serviceOwed;
          });
        } else {
          // If subtotal is 0 but there are fees, split fees evenly
          people.forEach(p => {
            const personData = personTotals[p.id];
            personData.taxOwed = parsedTax / (people.length || 1);
            personData.serviceOwed = parsedSc / (people.length || 1);
            personData.total = personData.itemsOwed + personData.taxOwed + personData.serviceOwed;
          });
        }

        return { subtotal, grandTotal, personTotals, parsedTax, parsedSc };
      }, [items, people, tax, serviceCharge]);


      const renderStep1 = () => (
        <div className="flex flex-col items-center justify-center space-y-8 animate-fade-in-up py-10">
          <div className="text-center space-y-2">
            <div className="mx-auto w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mb-4">
              <Receipt className="w-8 h-8 text-indigo-600" />
            </div>
            <h2 className="text-2xl font-bold text-gray-900">Scan Receipt</h2>
            <p className="text-gray-500 max-w-xs mx-auto">
              Upload a photo of your receipt (Thai/English supported) and we'll extract the items for you. First scan may take a few moments to download language data.
            </p>
          </div>

          {ocrStatus === 'processing' ? (
            <Card className="w-full max-w-sm p-8 flex flex-col items-center space-y-4">
              <div className="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
              <div className="text-center">
                <p className="font-semibold text-gray-800">{ocrStatusText}</p>
                <p className="text-sm text-gray-500 mt-1">{ocrProgress}% Complete</p>
              </div>
              <div className="w-full bg-gray-100 rounded-full h-2 mt-4">
                <div 
                  className="bg-indigo-600 h-2 rounded-full transition-all duration-300" 
                  style={{ width: `${ocrProgress}%` }}
                ></div>
              </div>
            </Card>
          ) : (
            <div className="w-full max-w-sm space-y-4">
              <input 
                type="file" 
                accept="image/*" 
                capture="environment"
                className="hidden" 
                ref={fileInputRef}
                onChange={handleImageUpload}
              />
              <Button 
                className="w-full py-5 text-lg" 
                icon={Camera}
                onClick={() => fileInputRef.current?.click()}
              >
                Take Photo or Upload
              </Button>
              
              <div className="relative flex items-center py-2">
                <div className="flex-grow border-t border-gray-200"></div>
                <span className="flex-shrink-0 mx-4 text-gray-400 text-sm">OR</span>
                <div className="flex-grow border-t border-gray-200"></div>
              </div>

              <Button 
                variant="secondary" 
                className="w-full" 
                icon={Edit2}
                onClick={() => {
                  setItems([{ id: Date.now().toString(), name: '', price: 0, assignedTo: [] }]);
                  setStep(2);
                }}
              >
                Enter Manually
              </Button>

              {errorMsg && (
                <div className="p-4 bg-red-50 text-red-700 text-sm rounded-xl flex items-start mt-4">
                  <AlertCircle className="w-5 h-5 mr-2 flex-shrink-0 mt-0.5" />
                  <p>{errorMsg}</p>
                </div>
              )}
            </div>
          )}
        </div>
      );

      const renderStep2 = () => (
        <div className="space-y-6 animate-fade-in-right pb-24">
          <div className="flex items-center space-x-3 mb-6">
            <button onClick={() => setStep(1)} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
              <ChevronLeft className="w-5 h-5 text-gray-700" />
            </button>
            <div>
              <h2 className="text-2xl font-bold text-gray-900">Review Items</h2>
              <p className="text-sm text-gray-500">Correct any mistakes from the scan</p>
            </div>
          </div>

          <div className="space-y-3">
            {items.map((item, index) => (
              <Card key={item.id} className="p-4">
                <div className="flex gap-3 items-center">
                  <div className="flex-grow">
                    <input 
                      type="text" 
                      value={item.name} 
                      onChange={(e) => updateItem(item.id, 'name', e.target.value)}
                      placeholder="Item name"
                      className="w-full text-base font-medium text-gray-900 border-none p-0 focus:ring-0 placeholder-gray-400 focus:outline-none"
                    />
                  </div>
                  <div className="w-24 shrink-0 relative">
                    <span className="absolute left-0 top-1/2 -translate-y-1/2 text-gray-500 font-medium text-sm">฿</span>
                    <input 
                      type="number" 
                      value={item.price || ''} 
                      onChange={(e) => updateItem(item.id, 'price', e.target.value)}
                      placeholder="0.00"
                      className="w-full text-right text-base font-semibold text-indigo-600 border-none p-0 focus:ring-0 pl-4 bg-transparent focus:outline-none"
                    />
                  </div>
                  <button 
                    onClick={() => removeItem(item.id)}
                    className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors"
                  >
                    <Trash2 className="w-5 h-5" />
                  </button>
                </div>
              </Card>
            ))}
          </div>

          <Button variant="outline" className="w-full border-dashed" onClick={addItem} icon={Plus}>
            Add Another Item
          </Button>

          <Card className="p-5 mt-6 bg-indigo-50/50 border-indigo-100">
            <div className="space-y-4">
              <div className="flex justify-between items-center">
                <span className="text-gray-700 font-medium">Tax / VAT</span>
                <div className="flex items-center w-24">
                  <span className="text-gray-500 mr-1 text-sm">฿</span>
                  <input 
                    type="number" 
                    value={tax || ''} 
                    onChange={(e) => setTax(e.target.value)}
                    placeholder="0.00"
                    className="w-full text-right font-medium text-gray-900 border-b border-gray-300 focus:border-indigo-500 p-1 bg-transparent rounded-none focus:outline-none"
                  />
                </div>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-gray-700 font-medium">Service Charge</span>
                <div className="flex items-center w-24">
                  <span className="text-gray-500 mr-1 text-sm">฿</span>
                  <input 
                    type="number" 
                    value={serviceCharge || ''} 
                    onChange={(e) => setServiceCharge(e.target.value)}
                    placeholder="0.00"
                    className="w-full text-right font-medium text-gray-900 border-b border-gray-300 focus:border-indigo-500 p-1 bg-transparent rounded-none focus:outline-none"
                  />
                </div>
              </div>
              <div className="flex justify-between items-center pt-4 border-t border-indigo-100 mt-2 font-bold text-indigo-700 text-lg">
                <span>Total Amount</span>
                <span>฿{formatCurrency(calculations.grandTotal)}</span>
              </div>
            </div>
          </Card>

          <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t border-gray-100 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
            <div className="max-w-md mx-auto">
              <Button 
                className="w-full" 
                onClick={() => setStep(3)}
                disabled={items.length === 0 || items.every(i => !i.name && !i.price)}
              >
                Continue to Split
                <ChevronRight className="w-5 h-5 ml-2" />
              </Button>
            </div>
          </div>
        </div>
      );

      const renderStep3 = () => (
        <div className="space-y-6 animate-fade-in-right pb-28">
          <div className="flex items-center space-x-3 mb-2">
            <button onClick={() => setStep(2)} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
              <ChevronLeft className="w-5 h-5 text-gray-700" />
            </button>
            <div>
              <h2 className="text-2xl font-bold text-gray-900">Who Shared What?</h2>
            </div>
          </div>

          {/* People Manager */}
          <div className="mb-8">
            <p className="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">People Sharing</p>
            <div className="flex flex-wrap gap-2">
              {people.map(person => (
                <div key={person.id} className="flex items-center bg-white border border-gray-200 rounded-full pl-3 pr-1 py-1 shadow-sm">
                  <input 
                    type="text" 
                    value={person.name}
                    onChange={(e) => updatePerson(person.id, e.target.value)}
                    className="w-20 bg-transparent border-none p-0 focus:outline-none text-sm font-medium text-gray-800"
                  />
                  <button onClick={() => removePerson(person.id)} className="p-1.5 text-gray-400 hover:text-red-500 rounded-full ml-1">
                    <X className="w-3.5 h-3.5" />
                  </button>
                </div>
              ))}
              <button 
                onClick={addPerson}
                className="flex items-center justify-center bg-indigo-50 text-indigo-600 border border-indigo-100 rounded-full px-4 py-1.5 text-sm font-semibold hover:bg-indigo-100 transition-colors"
              >
                <Plus className="w-4 h-4 mr-1" /> Add
              </button>
            </div>
          </div>

          {/* Assign Items */}
          <div className="space-y-4">
            {items.filter(item => item.name || item.price > 0).map(item => (
              <Card key={item.id} className="p-4 border-l-4 border-l-indigo-500">
                <div className="flex justify-between items-start mb-3">
                  <h3 className="font-semibold text-gray-900">{item.name || 'Unnamed Item'}</h3>
                  <span className="font-bold text-indigo-600">฿{formatCurrency(item.price)}</span>
                </div>
                
                <div className="flex flex-wrap gap-2">
                  {people.map(person => {
                    const isAssigned = item.assignedTo.includes(person.id);
                    return (
                      <button
                        key={person.id}
                        onClick={() => togglePersonForItem(item.id, person.id)}
                        className={`px-3 py-1.5 rounded-xl text-sm font-medium transition-all duration-200 border ${
                          isAssigned 
                            ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                            : 'bg-white text-gray-500 border-gray-200 hover:border-indigo-300'
                        }`}
                      >
                        {person.name}
                      </button>
                    );
                  })}
                </div>
              </Card>
            ))}
          </div>

          <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t border-gray-100 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
            <div className="max-w-md mx-auto flex gap-3">
              <Button 
                className="flex-1" 
                onClick={() => setStep(4)}
                icon={PieChart}
              >
                Calculate Split
              </Button>
            </div>
          </div>
        </div>
      );

      const renderStep4 = () => (
        <div className="space-y-6 animate-fade-in-right pb-10">
          <div className="flex items-center space-x-3 mb-6">
            <button onClick={() => setStep(3)} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
              <ChevronLeft className="w-5 h-5 text-gray-700" />
            </button>
            <div>
              <h2 className="text-2xl font-bold text-gray-900">Bill Summary</h2>
              <p className="text-sm text-gray-500">Here's who owes what</p>
            </div>
          </div>

          {/* Grand Total Card */}
          <Card className="p-6 bg-gradient-to-br from-indigo-600 to-indigo-800 text-white border-none shadow-lg shadow-indigo-200">
            <div className="text-indigo-100 text-sm font-medium mb-1">Total Bill</div>
            <div className="text-4xl font-bold">฿{formatCurrency(calculations.grandTotal)}</div>
            
            <div className="mt-4 pt-4 border-t border-white/20 flex justify-between text-sm">
              <div className="text-indigo-100">Subtotal: ฿{formatCurrency(calculations.subtotal)}</div>
              {(calculations.parsedTax > 0 || calculations.parsedSc > 0) && (
                <div className="text-indigo-100">
                  Fees: ฿{formatCurrency(calculations.parsedTax + calculations.parsedSc)}
                </div>
              )}
            </div>
          </Card>

          {/* Individual Summaries */}
          <div className="space-y-3">
            <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider mt-6 mb-2">Breakdown</h3>
            {people.map(person => {
              const data = calculations.personTotals[person.id];
              if (data.total === 0) return null; // Skip if they owe nothing
              
              return (
                <Card key={person.id} className="p-4">
                  <div className="flex justify-between items-center mb-2">
                    <div className="font-semibold text-lg text-gray-900 flex items-center">
                      <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center mr-3 text-sm">
                        {person.name.charAt(0).toUpperCase()}
                      </div>
                      {person.name}
                    </div>
                    <div className="font-bold text-xl text-indigo-600">
                      ฿{formatCurrency(data.total)}
                    </div>
                  </div>
                  
                  <div className="pl-11 text-sm text-gray-500 space-y-1">
                    <div className="flex justify-between">
                      <span>Items</span>
                      <span>฿{formatCurrency(data.itemsOwed)}</span>
                    </div>
                    {(data.taxOwed > 0 || data.serviceOwed > 0) && (
                      <div className="flex justify-between text-gray-400">
                        <span>Tax & Service (Proportional)</span>
                        <span>฿{formatCurrency(data.taxOwed + data.serviceOwed)}</span>
                      </div>
                    )}
                    <div className="flex justify-between font-semibold text-gray-950 pt-1 border-t border-dashed border-gray-150">
                      <span>Total Payment</span>
                      <span>฿{formatCurrency(data.total)}</span>
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>

          <div className="pt-6 space-y-3">
            <Button 
              className="w-full bg-emerald-600 hover:bg-emerald-700 text-white shadow-md shadow-emerald-100" 
              onClick={handleShareToLine}
              icon={Share2}
            >
              Share to LINE
            </Button>
            
            <Button 
              variant="outline" 
              className="w-full bg-white" 
              onClick={() => {
                if (window.confirm('Start over? This will clear all data.')) {
                  setItems([]);
                  setTax(0);
                  setServiceCharge(0);
                  setImage(null);
                  setStep(1);
                }
              }}
            >
              Start New Bill
            </Button>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-50 font-sans text-gray-900 selection:bg-indigo-100 selection:text-indigo-900">
          {/* Header */}
          <header className="bg-white px-6 py-4 flex items-center justify-between sticky top-0 z-10 border-b border-gray-100">
            <div className="flex items-center space-x-2">
              <div className="bg-indigo-600 p-1.5 rounded-xl">
                <PieChart className="w-5 h-5 text-white" />
              </div>
              <span className="font-bold text-xl tracking-tight text-gray-900">SharePay</span>
            </div>
            <div className="flex items-center space-x-3">
              {liffProfile && (
                <div className="flex items-center space-x-2 bg-gray-50 pl-2 pr-3 py-1 rounded-full border border-gray-100">
                  <img src={liffProfile.pictureUrl} alt="profile" className="w-6 h-6 rounded-full border border-indigo-200" />
                  <span className="text-xs font-semibold text-gray-700 max-w-[80px] truncate">{liffProfile.displayName}</span>
                </div>
              )}
              <div className="text-xs font-semibold text-gray-400 tracking-widest uppercase">
                Step {step} of 4
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-md mx-auto p-4 sm:p-6 pb-24 overflow-x-hidden">
            {step === 1 && renderStep1()}
            {step === 2 && renderStep2()}
            {step === 3 && renderStep3()}
            {step === 4 && renderStep4()}
          </main>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SharePayApp />);
  </script>
</body>
</html>
